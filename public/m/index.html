<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="color-scheme" content="dark">
  <title>App Music</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="m.css">
</head>
<body>
  <header class="top">
    <button class="icon back" id="back" aria-label="Retour" hidden><svg viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1 id="title">App Music</h1>
    <span class="conn" id="conn" title="Connexion à l’ordinateur"></span>
  </header>

  <main id="view"></main>

  <div class="banner" id="banner" hidden></div>

  <div class="mini" id="mini" hidden>
    <div class="mini-bar"><i id="mini-fill"></i></div>
    <button class="mini-open" id="mini-open" aria-label="Lecture en cours"><img id="mini-cover" alt=""><span class="mini-meta"><b id="mini-title"></b><small id="mini-sub"></small></span></button>
    <button class="icon" data-cmd="toggle" aria-label="Lecture / pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg></button>
    <button class="icon" data-cmd="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M12.5 12 3 5.5v13zM21.5 12 12 5.5v13z" fill="currentColor"/></svg></button>
    <button class="icon small" id="mini-queue" aria-label="À suivre"><svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M15 14.5v6l5-3z" fill="currentColor"/></svg></button>
  </div>

  <div class="minivol" id="minivol" hidden role="group" aria-label="Volume">
    <button class="vol-step" data-step="-1" aria-label="Moins fort"><svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <div class="vol-bar drag" id="vol-drag"><i></i><b></b></div>
    <span class="vol-pct">–</span>
    <button class="vol-step" data-step="1" aria-label="Plus fort"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
  <div class="vol-flash" id="vol-flash"></div>

  <nav class="tabs" id="tabs">
    <a href="#albums" data-tab="albums"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/></svg>Albums</a>
    <a href="#artists" data-tab="artists"><svg viewBox="0 0 24 24"><rect x="8.6" y="2.4" width="6.8" height="11.6" rx="3.4" fill="currentColor"/><path d="M5.6 10.8a6.4 6.4 0 0 0 12.8 0M12 17.2v3.6M8.6 20.8h6.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Artistes</a>
    <a href="#selections" data-tab="selections"><svg viewBox="0 0 24 24"><path d="M9.4 17.2V6.4l10-2.2v10.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.4" rx="2.9" ry="2.4" fill="currentColor"/><ellipse cx="16.6" cy="15" rx="2.9" ry="2.4" fill="currentColor"/></svg>Sélections</a>
    <a href="#search" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Recherche</a>
  </nav>

  <section class="np" id="np" aria-hidden="true">
    <button class="icon np-close" id="np-close" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="np-scroll">
      <img class="np-cover" id="np-cover" alt="">
      <div class="np-title" id="np-title"></div>
      <a class="np-artist" id="np-artist"></a>
      <div class="seek" id="seek"><div class="seek-track"><i id="seek-fill"></i></div></div>
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
      <div class="np-controls">
        <button class="icon small" data-cmd="shuffle" id="np-shuffle" aria-label="Aléatoire"><svg viewBox="0 0 24 24"><path d="M3 7h3.5c3.5 0 4.5 10 8 10H20M3 17h3.5c1.4 0 2.4-1.6 3.3-3.6M14.5 7H20M17.5 4 20.5 7l-3 3M17.5 14l3 3-3 3M11.3 9.4C12.2 8 13.1 7 14.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon" data-cmd="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M11.5 12 21 5.5v13zM2.5 12 12 5.5v13z" fill="currentColor"/></svg></button>
        <button class="icon big" data-cmd="toggle" aria-label="Lecture / pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1" fill="currentColor"/></svg></button>
        <button class="icon" data-cmd="next" aria-label="Suivant"><svg viewBox="0 0 24 24"><path d="M12.5 12 3 5.5v13zM21.5 12 12 5.5v13z" fill="currentColor"/></svg></button>
        <button class="icon small" data-cmd="repeat" id="np-repeat" aria-label="Répéter"><svg viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19m-3-3 3 3-3 3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5m3 3-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="one">1</span></button>
      </div>
      <div class="rocker" role="group" aria-label="Volume">
        <button class="vol-step" data-step="-1" aria-label="Moins fort"><svg viewBox="0 0 24 24"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z" fill="currentColor"/><path d="M15 12h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <div class="rocker-mid"><span class="vol-pct">–</span><span class="vol-bar"><i></i></span></div>
        <button class="vol-step" data-step="1" aria-label="Plus fort"><svg viewBox="0 0 24 24"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z" fill="currentColor"/><path d="M18 9v6M15 12h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="q-head"><h2>À suivre</h2><button class="link" id="q-clear" hidden>Vider</button></div>
      <div class="queue" id="queue"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
  <script src="m.js" type="module"></script>
</body>
</html>
